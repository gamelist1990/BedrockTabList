name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: BedrockDynamicSDK branch, tag, or commit
        required: true
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build and test
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  windows-dll:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DBEDROCK_SDK_REF=${{ github.event.inputs.sdk_ref || 'main' }}
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockTabList-windows-x64
          path: build/Release/BedrockTabList.dll

